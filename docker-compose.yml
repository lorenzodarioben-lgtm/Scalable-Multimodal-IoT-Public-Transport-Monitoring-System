# Local development stack for the SIT314 transport monitoring system.
#
# This runs the LOCAL variant of the pipeline: a local MQTT broker stands in for
# AWS IoT Core, and the services use the file-backed queue/store adapters. It
# exists so the whole pipeline can be demonstrated on one machine.
#
#   docker compose up broker node-red          # ingestion + validation only
#   docker compose --profile workers up        # add the three services
#
# For the AWS variant, set QUEUE_BACKEND/STORE_BACKEND/METRICS_BACKEND to `aws`
# and MQTT_MODE to `aws`; see docs/AWS_DEPLOYMENT.md.
#
# No secrets appear in this file. Certificates are mounted read-only from
# ./certs, which is excluded from Git.

name: sit314-transport

services:
  broker:
    build:
      context: .
      dockerfile: node-red/Dockerfile.broker
    image: sit314-transport-broker
    container_name: sit314-broker
    ports:
      # Keep 1883 as the default, but permit a host-side override when another
      # local MQTT broker already owns loopback port 1883. The container and
      # inter-service port remain 1883.
      - "${MQTT_HOST_PORT:-1883}:1883"
    environment:
      MQTT_BIND_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(1883,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Node-RED performs the mode-specific validation and normalisation.
  # The flow is mounted from the repository so what is committed is what runs.
  node-red:
    image: nodered/node-red:4.0
    container_name: sit314-node-red
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "1880:1880"
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: sit314-node-red
      FLOWS: flows.json
    # Only the flow is mounted, read-only, so what is committed is what runs.
    # There is deliberately NO named volume on /data/lib: the official image runs
    # as uid 1000, a fresh named volume is created root-owned, and Node-RED then
    # fails to start with "EACCES: permission denied, mkdir '/data/lib/flows'".
    # Nothing here needs to persist - the authoritative flow is in the repository
    # and the runtime config is disposable.
    volumes:
      - ./node-red/flows.json:/data/flows.json:ro

  # ---- application services (opt in with: --profile workers) --------------

  # Local stand-in for the AWS IoT rule. Node-RED republishes validated,
  # normalised events to transport/normalized/+; on AWS an IoT rule forwards
  # that topic to the telemetry queue, and locally this bridge does the same.
  # Without it the pipeline stops dead at Node-RED and the queue stays empty.
  # It reuses the broker image, which already carries scripts/ and mqtt.
  bridge:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: node-red/Dockerfile.broker
    image: sit314-transport-broker
    container_name: sit314-bridge
    command: ["node", "scripts/normalized-bridge.js"]
    depends_on:
      broker:
        condition: service_healthy
    environment:
      MQTT_LOCAL_HOST: broker
      MQTT_LOCAL_PORT: "1883"
      QUEUE_BACKEND: ${QUEUE_BACKEND:-local}
      LOCAL_DATA_DIR: /data
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BRIDGE_VERBOSE: ${BRIDGE_VERBOSE:-false}
    volumes:
      - local-data:/data
    restart: unless-stopped

  telemetry-processor:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: services/telemetry-processor/Dockerfile
    image: sit314-transport-telemetry-processor
    environment:
      QUEUE_BACKEND: ${QUEUE_BACKEND:-local}
      STORE_BACKEND: ${STORE_BACKEND:-local}
      METRICS_BACKEND: ${METRICS_BACKEND:-local}
      LOCAL_DATA_DIR: /data
      AWS_REGION: ${AWS_REGION:-us-east-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    volumes:
      - local-data:/data
    restart: unless-stopped

  route-impact-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: services/route-impact-worker/Dockerfile
    image: sit314-transport-route-impact-worker
    environment:
      QUEUE_BACKEND: ${QUEUE_BACKEND:-local}
      STORE_BACKEND: ${STORE_BACKEND:-local}
      METRICS_BACKEND: ${METRICS_BACKEND:-local}
      LOCAL_DATA_DIR: /data
      AWS_REGION: ${AWS_REGION:-us-east-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Documented TEST PARAMETER, default off.
      WORKER_PROCESSING_DELAY_MS: ${WORKER_PROCESSING_DELAY_MS:-0}
    volumes:
      - local-data:/data
    # `docker compose up --scale route-impact-worker=3` is the local analogue of
    # scaling the ECS service; on AWS this is done by Application Auto Scaling.
    restart: unless-stopped

  notification-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    image: sit314-transport-notification-worker
    environment:
      QUEUE_BACKEND: ${QUEUE_BACKEND:-local}
      STORE_BACKEND: ${STORE_BACKEND:-local}
      METRICS_BACKEND: ${METRICS_BACKEND:-local}
      LOCAL_DATA_DIR: /data
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - local-data:/data
    restart: unless-stopped

volumes:
  # Shared by the three workers so they see the same local queue and store,
  # which is what makes `--scale route-impact-worker=N` a real concurrency test.
  local-data:
